openapi: 3.1.0
info:
  title: SwarmCircuit implemented control protocol supplement
  version: 0.5.0
  description: Phase 3 protocol with Phase 5 durable history; original openapi.yaml
    is frozen. Only hold/resume at explicitly owned reversible checkpoints are supported.
    Task ID is mandatory. Credential roles are enforced by the service; runtime tokens
    are returned only at SDK registration. See docs/decisions/0003-control.md for
    safety and recovery semantics.
