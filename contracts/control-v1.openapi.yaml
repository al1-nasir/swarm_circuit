components:
  schemas:
    Ack:
      properties:
        runtime_session_id:
          type: string
          format: uuid
          title: Runtime Session Id
        fencing_epoch:
          type: integer
          minimum: 1.0
          title: Fencing Epoch
        ack_key:
          type: string
          maxLength: 180
          minLength: 8
          title: Ack Key
        result:
          type: string
          enum:
          - applied
          - rejected
          - failed
          title: Result
        result_detail:
          anyOf:
          - type: string
            maxLength: 250
          - type: 'null'
          title: Result Detail
      additionalProperties: false
      type: object
      required:
      - runtime_session_id
      - fencing_epoch
      - ack_key
      - result
      title: Ack
    Backpressure:
      properties:
        expected_preview_sha256:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Expected Preview Sha256
        approval_id:
          type: string
          format: uuid
          title: Approval Id
        apply:
          type: boolean
          title: Apply
          default: false
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - approval_id
      - reason
      title: Backpressure
    CheckpointEnter:
      properties:
        task_id:
          type: string
          format: uuid
          title: Task Id
        checkpoint_key:
          type: string
          maxLength: 180
          minLength: 16
          title: Checkpoint Key
        label:
          type: string
          maxLength: 150
          minLength: 1
          title: Label
        reversible:
          type: boolean
          const: true
          title: Reversible
      additionalProperties: false
      type: object
      required:
      - task_id
      - checkpoint_key
      - label
      - reversible
      title: CheckpointEnter
    CommandBatch:
      properties:
        commands:
          items:
            $ref: '#/components/schemas/CommandRecord'
          type: array
          title: Commands
      additionalProperties: false
      type: object
      required:
      - commands
      title: CommandBatch
    CommandRecord:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        command_kind:
          type: string
          enum:
          - hold_task
          - resume_task
          - cancel_task
          - coalesce_approval
          title: Command Kind
        state:
          type: string
          enum:
          - queued
          - dispatched
          - applied
          - rejected
          - timed_out
          - unknown
          title: State
        runtime_session_id:
          type: string
          format: uuid
          title: Runtime Session Id
        session_fencing_epoch:
          type: integer
          minimum: 1.0
          title: Session Fencing Epoch
        task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Task Id
        checkpoint_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Checkpoint Id
        created_at_ms:
          type: integer
          title: Created At Ms
        acknowledgements:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Acknowledgements
      additionalProperties: true
      type: object
      required:
      - command_id
      - command_kind
      - state
      - runtime_session_id
      - session_fencing_epoch
      - task_id
      - checkpoint_id
      - created_at_ms
      - acknowledgements
      title: CommandRecord
    CommandRequest:
      properties:
        command_kind:
          type: string
          enum:
          - hold_task
          - resume_task
          title: Command Kind
        runtime_session_id:
          type: string
          format: uuid
          title: Runtime Session Id
        task_id:
          type: string
          format: uuid
          title: Task Id
        incident_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Incident Id
        approval_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Approval Id
        expected_task_version:
          type: integer
          minimum: 0.0
          title: Expected Task Version
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - command_kind
      - runtime_session_id
      - task_id
      - expected_task_version
      - reason
      title: CommandRequest
    ControlProblem:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        correlation_id:
          type: string
          format: uuid
          title: Correlation Id
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - correlation_id
      title: ControlProblem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Presentation:
      properties:
        event_id:
          type: string
          format: uuid
          title: Event Id
      additionalProperties: false
      type: object
      required:
      - event_id
      title: Presentation
    PresentationResult:
      properties:
        state:
          type: string
          enum:
          - presented
          - unknown
          title: State
      additionalProperties: false
      type: object
      required:
      - state
      title: PresentationResult
    Registration:
      properties:
        runtime_key:
          type: string
          maxLength: 150
          minLength: 1
          title: Runtime Key
        client_nonce:
          type: string
          maxLength: 180
          minLength: 16
          title: Client Nonce
        capabilities:
          items:
            type: string
            enum:
            - hold_task
            - resume_task
          type: array
          maxItems: 2
          minItems: 1
          title: Capabilities
      additionalProperties: false
      type: object
      required:
      - runtime_key
      - client_nonce
      - capabilities
      title: Registration
    RuntimeRegistered:
      properties:
        runtime_session_id:
          type: string
          format: uuid
          title: Runtime Session Id
        fencing_epoch:
          type: integer
          minimum: 1.0
          title: Fencing Epoch
        session_token:
          type: string
          title: Session Token
          description: Secret; SDK registration response only
        expires_at_ms:
          type: integer
          title: Expires At Ms
      additionalProperties: false
      type: object
      required:
      - runtime_session_id
      - fencing_epoch
      - session_token
      - expires_at_ms
      title: RuntimeRegistered
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    RuntimeSessionBearer:
      type: http
      scheme: bearer
