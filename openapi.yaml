openapi: 3.1.0
info:
  title: SwarmCircuit Technical API Contract
  version: 1.0.0-draft
  description: >-
    Proposed application REST and runtime command protocol for SwarmCircuit TRD v1.
    This is a design artifact, not a deployed service. OTLP /v1/traces follows the
    OpenTelemetry protocol, whose protobuf envelope is documented separately.
servers:
  - url: http://127.0.0.1:8000
    description: Loopback-only local MVP
security:
  - bearerAuth: []
tags:
  - name: runs
  - name: events
  - name: runtime
  - name: incidents
  - name: experiments
paths:
  /api/v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Server and database ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ready, degraded]}
                  schema_version: {type: string}
                required: [status, schema_version]
  /api/v1/projects/{project_id}/runs:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Cursor-paginated run summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Run'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [runs]
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mode]
              properties:
                name: {type: string, minLength: 1, maxLength: 150}
                mode: {type: string, enum: [observe, control]}
                external_run_key: {type: string, maxLength: 150}
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      tags: [runs]
      operationId: getRun
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{run_id}/graph:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      tags: [runs]
      operationId: getGraph
      parameters:
        - name: view
          in: query
          schema: {type: string, enum: [task, agent], default: task}
      responses:
        '200':
          description: Versioned graph projection, not authorization truth
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphSnapshot'}
  /api/v1/runs/{run_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      tags: [runs]
      operationId: getTimeline
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Sanitized events and spans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TimelineItem'}}
                  next_cursor: {type: [string, 'null']}
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/runId'
    post:
      tags: [events]
      operationId: appendEvents
      description: Persists accepted events before acknowledging. Server assigns evidence trust class from credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items: {$ref: '#/components/schemas/LifecycleEvent'}
      responses:
        '200':
          description: Event storage result with dedup accounting
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, rejected]
                properties:
                  accepted: {type: integer, minimum: 0}
                  duplicates: {type: integer, minimum: 0}
                  rejected: {type: integer, minimum: 0}
                  rejected_keys: {type: array, items: {type: string}}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/runs/{run_id}/incidents:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      tags: [incidents]
      operationId: listIncidents
      responses:
        '200':
          description: Evidence-backed incidents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Incident'}}
  /api/v1/runs/{run_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      tags: [runs]
      operationId: listApprovals
      responses:
        '200':
          description: Sanitized approval groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {type: object}}
  /api/v1/runs/{run_id}/payments:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      tags: [runs]
      operationId: listPayments
      responses:
        '200':
          description: Sanitized GateKeep402 decisions and payment effects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {type: object}}
  /api/v1/runs/{run_id}/runtime-sessions:
    parameters:
      - $ref: '#/components/parameters/runId'
    post:
      tags: [runtime]
      operationId: registerRuntime
      description: SDK credential required; never exposes session bearer tokens to UI clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_key, capabilities, client_nonce]
              properties:
                runtime_key: {type: string, minLength: 1, maxLength: 150}
                capabilities:
                  type: array
                  uniqueItems: true
                  items: {type: string, enum: [hold_task, resume_task, cancel_task, coalesce_approval]}
                client_nonce: {type: string, minLength: 16}
      responses:
        '201':
          description: Registered session and new fenced epoch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeSession'}
  /api/v1/runtime-sessions/{session_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      tags: [runtime]
      operationId: runtimeHeartbeat
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  alive: {type: boolean}
                  fencing_epoch: {type: integer}
  /api/v1/runtime-sessions/{session_id}/commands:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      tags: [runtime]
      operationId: pollCommands
      parameters:
        - name: wait_ms
          in: query
          schema: {type: integer, minimum: 0, maximum: 20000, default: 10000}
      responses:
        '200':
          description: Commands targeted to the authorized runtime session
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands: {type: array, items: {$ref: '#/components/schemas/ControlCommand'}}
  /api/v1/runs/{run_id}/control-commands:
    parameters:
      - $ref: '#/components/parameters/runId'
    post:
      tags: [runtime]
      operationId: enqueueControlCommand
      description: Accepted only in Control mode after capability, current epoch and optimistic version checks.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 180}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlCommandRequest'}
      responses:
        '202':
          description: Command queued, effect NOT yet proven
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlCommand'}
        '403': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/control-commands/{command_id}/ack:
    parameters:
      - name: command_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [runtime]
      operationId: acknowledgeCommand
      description: Authenticated runtime session only; require matching session, epoch, capability and command.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ControlAck'}
      responses:
        '200':
          description: Accepted acknowledgement and resulting command state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlCommand'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/experiments/{experiment_id}/results:
    parameters:
      - name: experiment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [experiments]
      operationId: experimentResults
      responses:
        '200':
          description: Trial metadata and metric summary
          content:
            application/json:
              schema: {type: object}
  /api/v1/experiments/{experiment_id}/export.csv:
    parameters:
      - name: experiment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [experiments]
      operationId: exportExperiment
      responses:
        '200':
          description: Raw experiment metrics in CSV
          content:
            text/csv:
              schema: {type: string}
components:
  parameters:
    runId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    projectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    sessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    Unauthorized:
      description: Credential absent or insufficient
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Stale state/version, duplicate conflicting idempotency key, or mode mismatch
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Entity not found or inaccessible within the authenticated project
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Invalid:
      description: Invalid request envelope or payload
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Write coordinator unavailable; no successful persistence acknowledgement
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string}
      required: [code, message]
    Run:
      type: object
      required: [run_id, project_id, name, mode, status]
      properties:
        run_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        mode: {type: string, enum: [observe, control]}
        status: {type: string, enum: [created, running, waiting, stalled, recovering, completed, failed, cancelled]}
        started_at_ms: {type: [integer, 'null']}
        updated_at_ms: {type: integer}
    LifecycleEvent:
      type: object
      required: [event_id, source_event_key, event_kind, occurred_at_ms, payload]
      properties:
        event_id: {type: string, format: uuid}
        source_event_key: {type: string, minLength: 1}
        event_kind: {type: string, minLength: 1}
        occurred_at_ms: {type: integer}
        agent_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        payload: {type: object, additionalProperties: true}
    TimelineItem:
      type: object
      required: [id, item_type, occurred_at_ms]
      properties:
        id: {type: string}
        item_type: {type: string, enum: [event, span]}
        occurred_at_ms: {type: integer}
        agent_id: {type: [string, 'null']}
        task_id: {type: [string, 'null']}
        label: {type: string}
    GraphSnapshot:
      type: object
      required: [run_id, projection_version, view, nodes, edges]
      properties:
        run_id: {type: string, format: uuid}
        projection_version: {type: integer, minimum: 0}
        view: {type: string, enum: [task, agent]}
        nodes: {type: array, items: {type: object}}
        edges: {type: array, items: {type: object}}
    Incident:
      type: object
      required: [incident_id, kind, state, evidence_event_ids]
      properties:
        incident_id: {type: string, format: uuid}
        kind: {type: string}
        state: {type: string, enum: [open, acknowledged, resolved, suppressed]}
        evidence_event_ids: {type: array, items: {type: string, format: uuid}}
        affected_task_ids: {type: array, items: {type: string, format: uuid}}
        uncertainty: {type: string}
    RuntimeSession:
      type: object
      required: [runtime_session_id, fencing_epoch, session_token]
      properties:
        runtime_session_id: {type: string, format: uuid}
        fencing_epoch: {type: integer, minimum: 1}
        session_token: {type: string, description: Secret; returned only to the SDK at registration}
    ControlCommandRequest:
      type: object
      required: [command_kind, runtime_session_id, expected_task_version, reason]
      properties:
        command_kind: {type: string, enum: [hold_task, resume_task]}
        runtime_session_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        expected_task_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ControlCommand:
      type: object
      required: [command_id, command_kind, state, runtime_session_id, session_fencing_epoch]
      properties:
        command_id: {type: string, format: uuid}
        command_kind: {type: string, enum: [hold_task, resume_task, cancel_task, coalesce_approval]}
        runtime_session_id: {type: string, format: uuid}
        session_fencing_epoch: {type: integer, minimum: 1}
        state: {type: string, enum: [queued, dispatched, applied, rejected, timed_out, unknown]}
        task_id: {type: [string, 'null']}
        created_at_ms: {type: integer}
    ControlAck:
      type: object
      required: [runtime_session_id, fencing_epoch, ack_key, result]
      properties:
        runtime_session_id: {type: string, format: uuid}
        fencing_epoch: {type: integer, minimum: 1}
        ack_key: {type: string, minLength: 8}
        result: {type: string, enum: [applied, rejected, failed]}
        result_detail: {type: string}
