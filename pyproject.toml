[project]
name = "swarmcircuit-workspace"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["swarmcircuit-sdk[otel]", "swarmcircuit-server"]

[project.optional-dependencies]
payments = ["swarmcircuit-sdk[payments]"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<2", "pyyaml>=6,<7", "types-PyYAML", "types-protobuf"]

[tool.uv.workspace]
members = ["packages/sdk", "packages/server"]

[tool.uv.sources]
swarmcircuit-sdk = { workspace = true }
swarmcircuit-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/sdk/src", "packages/server/src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["packages/sdk/src", "packages/server/src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

