[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "swarmcircuit-server"
version = "0.5.0"
description = "Local SwarmCircuit observation and cooperative control service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=15,<18", "python-dotenv>=1,<2", "opentelemetry-proto>=1.28,<2", "googleapis-common-protos>=1.60,<2", "swarmcircuit-sdk>=0.5,<0.6"]

[project.optional-dependencies]
research = ["httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/swarmcircuit_server"]

